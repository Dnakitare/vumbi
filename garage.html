<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vumbi · garage</title>
    <style>
      :root {
        --ink: #eef1f4;
        --dim: #97a0ab;
        --accent: #ff7a3c;
        --panel: rgba(18, 21, 26, 0.72);
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #6b7078; font-family: var(--sans); color: var(--ink); }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      .title { position: fixed; top: 16px; left: 20px; font-family: var(--mono); letter-spacing: 0.16em; font-size: 15px; opacity: 0.85; }
      .title b { color: var(--accent); }

      .card {
        position: fixed; top: 74px; left: 20px; width: 260px; z-index: 5;
        background: var(--panel); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
        padding: 18px 18px 16px; backdrop-filter: blur(6px);
      }
      .name { font-size: 30px; font-weight: 800; letter-spacing: -0.01em; }
      .blurb { color: var(--dim); font-size: 13px; margin: 2px 0 16px; font-family: var(--mono); }
      .stat { display: grid; grid-template-columns: 62px 1fr; align-items: center; gap: 10px; margin-bottom: 9px; }
      .stat span { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.05em; }
      .bar { height: 7px; border-radius: 4px; background: rgba(255,255,255,0.1); overflow: hidden; }
      .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #ffd27a); border-radius: 4px; }

      .picker { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 5; }
      .pick {
        font-family: var(--mono); font-size: 13px; padding: 9px 16px; border-radius: 10px; cursor: pointer;
        background: var(--panel); border: 1px solid rgba(255,255,255,0.1); color: var(--dim); backdrop-filter: blur(6px);
      }
      .pick.on { border-color: var(--accent); color: var(--ink); }
      .pick b { color: var(--dim); font-weight: 600; margin-right: 6px; }
      .pick.on b { color: var(--accent); }

      .raceBtn { position: fixed; bottom: 66px; left: 50%; transform: translateX(-50%); z-index: 6; font-family: var(--sans); font-size: 15px; font-weight: 700; padding: 12px 30px; border-radius: 12px; cursor: pointer; border: none; background: var(--accent); color: #2a1406; box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
      .raceBtn:hover { filter: brightness(1.06); }
      .hint { position: fixed; bottom: 20px; right: 20px; font-family: var(--mono); font-size: 11px; color: rgba(255,255,255,0.55); text-align: right; line-height: 1.7; z-index: 5; }
      .hint b { color: var(--accent); }
    </style>
    <script type="module" crossorigin src="/vumbi/assets/garage-DmwG62EH.js"></script>
    <link rel="modulepreload" crossorigin href="/vumbi/assets/cars-B7S39gPq.js">
  </head>
  <body>
    <div id="app"></div>
    <div class="title">VUMBI <b>GARAGE</b></div>
    <div class="card">
      <div class="name" id="name">240Z</div>
      <div class="blurb" id="blurb"></div>
      <div class="stat"><span>power</span><div class="bar"><i id="s-power"></i></div></div>
      <div class="stat"><span>grip</span><div class="bar"><i id="s-grip"></i></div></div>
      <div class="stat"><span>agility</span><div class="bar"><i id="s-agility"></i></div></div>
      <div class="stat"><span>drift</span><div class="bar"><i id="s-drift"></i></div></div>
    </div>
    <div class="picker" id="picker"></div>
    <button class="raceBtn" id="raceBtn">race this car →</button>
    <div class="hint"><div>drag to orbit · scroll to zoom</div><div><b>1–4</b> car &nbsp; <b>F S R T</b> angles &nbsp; <b>Space</b> spin</div></div>
  </body>
</html>
